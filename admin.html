<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration - Jade Photographie</title>

<link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    padding: 32px;
    min-height: 100vh;
    background: linear-gradient(180deg, #f8f6f2 0%, #efe7dd 100%);
    font-family: "Playfair Display", serif;
    color: #3f3022;
}

.admin-container {
    max-width: 1100px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e6dbd0;
    border-radius: 28px;
    box-shadow: 0 32px 90px rgba(76, 58, 42, 0.12);
    padding: 42px;
}

h1,
h2,
h3 {
    margin: 0 0 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
}

h1 {
    font-size: clamp(2rem, 3.5vw, 3rem);
    color: #2f1f14;
}

h2 {
    font-size: 1.8rem;
    color: #3f3022;
}

h3 {
    font-size: 1.35rem;
    color: #7c5f47;
}

#loginBox,
#adminPanel {
    text-align: left;
}

#loginBox {
    max-width: 520px;
    margin: 0 auto;
    padding: 30px 28px;
    background: #fbf5ef;
    border: 1px solid #e8ddd2;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(99, 73, 49, 0.08);
}

input,
select,
button {
    width: 100%;
    padding: 14px 16px;
    margin: 8px 0;
    border-radius: 14px;
    border: 1px solid #d8c6b4;
    background: #fff;
    font-family: inherit;
    color: #3f3022;
}

button {
    cursor: pointer;
    border: none;
    background: #8a6e57;
    color: #fff;
    transition: background 0.2s ease, transform 0.2s ease;
}

button:hover {
    background: #755c47;
    transform: translateY(-1px);
}

button#logoutBtn {
    background: #5f4a36;
}

#adminPanel {
    display: none;
}

.admin-section {
    margin-top: 36px;
    padding: 30px;
    border: 1px solid #e7d9ce;
    border-radius: 24px;
    background: #fbf5ef;
}

#previewGallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 22px;
    margin-top: 20px;
}

.photo-admin-card {
    background: #ffffff;
    border: 1px solid #e4d7cc;
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 18px 34px rgba(78, 60, 42, 0.08);
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
}

.photo-admin-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 18px;
}

.photo-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.photo-actions button {
    margin: 0;
    padding: 12px 8px;
}

#imagePreview {
    display: block;
    width: min(100%, 320px);
    border-radius: 18px;
    border: 1px solid #e3d6ca;
    margin-top: 12px;
}

@media (max-width: 720px) {
    body {
        padding: 18px;
    }

    .admin-container {
        padding: 28px 22px;
    }

    .photo-actions {
        grid-template-columns: 1fr;
    }
}

</style>


</head>



<body>


<div class="admin-container">



<h1>
Administration Jade Photographie
</h1>





<!-- CONNEXION -->

<div id="loginBox">


<h2>
Connexion
</h2>



<input 
type="email"
id="email"
placeholder="Adresse email">



<input
type="password"
id="password"
placeholder="Mot de passe">



<button id="loginBtn">
Se connecter
</button>



<p id="message"></p>



</div>







<!-- PANEL ADMIN -->

<div id="adminPanel">



<h2>
Bienvenue Jade
</h2>



<button id="logoutBtn">
Déconnexion
</button>








<!-- AJOUT PHOTO -->


<section class="admin-section">


<h3>
Ajouter une photo
</h3>



<input
type="file"
id="photoFile"
accept="image/*">



<br>



<img 
id="imagePreview"
src=""
style="
display:none;
width:250px;
margin:15px;
border-radius:15px;
">





<br>



<input
type="text"
id="photoTitle"
placeholder="Titre de la photo">





<br>



<select id="photoCategory">


<option value="portraits">
Portraits
</option>


<option value="bapteme">
Baptême
</option>


<option value="famille">
Famille
</option>


<option value="couples">
Couples
</option>


<option value="mariage">
Mariage
</option>


<option value="miss">
Miss
</option>


<option value="entreprise">
Entreprise
</option>


<option value="amis">
Amis
</option>


</select>





<br>



<button id="uploadBtn">

Publier la photo

</button>




<p id="uploadMessage"></p>



</section>









<!-- GESTION GALERIE -->


<section class="admin-section">



<h3>
Gérer une galerie
</h3>




<select id="manageCategory">


<option value="portraits">
Portraits
</option>


<option value="bapteme">
Baptême
</option>


<option value="famille">
Famille
</option>


<option value="couples">
Couples
</option>


<option value="mariage">
Mariage
</option>


<option value="miss">
Miss
</option>


<option value="entreprise">
Entreprise
</option>


<option value="amis">
Amis
</option>


</select>




<div id="previewGallery">


</div>



</section>





</div>


</div>






<script src="script.js"></script>
<script type="module" src="admin.js"></script>

<button class="scroll-top" onclick="scrollToTop()" aria-label="Remonter en haut de la page">↑</button>

</body>


</html>
