<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidéos - Jade Photographie</title>
    <link rel="icon" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .video-page {
            width: min(1200px, 92vw);
            margin: 56px auto 80px;
        }

        .video-page h1 {
            margin: 0 0 34px;
            color: #4f3a2b;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 28px;
        }

        .video-card {
            overflow: hidden;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1);
        }

        .video-card video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1f1b18;
        }

        .video-card h2 {
            margin: 0;
            padding: 16px 18px 18px;
            color: #4f3a2b;
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            font-weight: 400;
        }

        @media (max-width: 768px) {
            .video-page {
                margin: 34px auto 56px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="carousel" class="contact-hero">
        <img src="images/polaroid_2.jpg" alt="Vidéos de Jade Photographie" class="carousel-img">

        <nav class="carousel-menu" aria-label="Menu principal">
            <a href="index.html">Accueil</a>
            <a href="histoire.html">Mon Histoire</a>
            <a href="index.html" class="carousel-logo">
                <img src="images/logo_jade.png" alt="Logo Jade">
            </a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="carousel-title">
            <h1>Vidéos</h1>
        </div>

        <div class="carousel-cloud" aria-hidden="true">
            <svg viewBox="0 0 1200 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,60 C150,90 300,30 450,60 C620,105 780,35 930,65 C1040,90 1120,40 1200,55 L1200,140 L0,140 Z" fill="#f8f6f2"></path>
            </svg>
        </div>
    </div>

    <main class="video-page">
        <h1>Coulisses &amp; bandes-annonces</h1>
        <section class="video-grid" aria-label="Vidéos">
            <article class="video-card">
                <video controls preload="metadata">
                    <source src="images/presentation.mp4" type="video/mp4">
                </video>
                <h2>Dans les coulisses</h2>
            </article>
            <article class="video-card">
                <video controls preload="metadata">
                    <source src="images/victoria&benjamin.mp4" type="video/mp4">
                </video>
                <h2>Bande-annonce Mariage</h2>
            </article>
        </section>
    </main>

    <img class="separator-image" src="images/double_text_separator (1).png" alt="Séparateur de texte">
    <p class="footer-brand">@JADE.C PHOTOGRAPHIE</p>
    <footer class="site-footer">
        <img class="footer-logo" src="images/logo_jade.png" alt="Logo Jade Photographie">
        <p class="footer-title">Pour me contacter :</p>
        <div class="footer-socials">
            <a class="socials" href="https://mail.google.com/mail/?view=cm&amp;to=jaadeplbphoto@gmail.com" target="_blank" rel="noopener noreferrer"><img src="images/logo_gmail.png" alt="Envoyer un mail"></a>
            <a class="socials" href="https://www.facebook.com/profile.php?id=100077318054317&amp;locale=fr_FR" target="_blank" rel="noopener noreferrer"><img src="images/logo_facebook.png" alt="Logo Facebook"></a>
            <a class="socials" href="https://www.instagram.com/jcphotographe276/" target="_blank" rel="noopener noreferrer"><img src="images/logo_insta.png" alt="Logo Instagram"></a>
            <a class="socials" href="https://www.youtube.com/@Jcphotographe276" target="_blank" rel="noopener noreferrer"><img src="images/logo_youtube.png" alt="Logo YouTube"></a>
        </div>
        <nav class="footer-links" aria-label="Liens du footer">
            <a href="index.html">Accueil</a>
            <a href="histoire.html">Mon Histoire</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html">Contact</a>
        </nav>
        <p class="footer-copyright">@ 2026 Jade.C Photographie</p>
    </footer>

       class="reservation-btn"

       rel="noopener noreferrer"
       aria-label="Réserver un shooting">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Réserver</span>
    </a>
</body>
</html>
