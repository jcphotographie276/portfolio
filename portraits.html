<script type="module">


import { initializeApp } 

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";



import { 

getFirestore,
collection,
query,
where,
getDocs,
orderBy

} 

from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyCf7-hELe7UTM4qRrSP-BTFeySo2Zk_678",

authDomain: "jade-photographie.firebaseapp.com",

projectId: "jade-photographie",

storageBucket: "jade-photographie.firebasestorage.app",

messagingSenderId: "774610773034",

appId: "1:774610773034:web:6b1d57344eaa65dadf4f53"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);





const gallery = document.getElementById("portraitsGallery");





async function chargerportraits(){


try {


const q = query(

collection(db, "photos"),

where("categorie", "==", "portraits"),

orderBy("ordre", "asc")

);





const result = await getDocs(q);





result.forEach((doc, index)=>{


const photo = doc.data();



let classe = "portrait-card";



if(index % 8 === 0 || index % 8 === 3){

classe = "portrait-card portrait-card-large";

}



if(index % 8 === 6){

classe = "portrait-card portrait-card-wide";

}





gallery.innerHTML += `


<figure class="${classe}">


<img 

src="${photo.url}"

alt="${photo.titre}">


</figure>


`;



});



}

catch(error){


console.error(
"Erreur chargement portraits :",
error
);


}


}





chargerportraits();



</script>
